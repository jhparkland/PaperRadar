# =============================================================================
# venues.example.yaml — 추적 목록 템플릿
# =============================================================================
# 사용법
#   1. 이 파일을 config/venues.yaml 로 복사한다.
#   2. owner, domain 을 채운다.
#   3. 아래 예시 항목을 지우고 내 분야 항목을 넣는다.
#      - 이미 조사된 것은 catalog/*.yaml 에서 복사
#      - 없는 분야는 Claude 에게 "venues setup" 을 시켜 초안을 받는다 (docs/venue-research.md)
#   4. python scripts/validate.py  로 검사 → 통과해야 실행 가능
#   5. python scripts/match.py "출처 문자열"  로 실제 알림의 출처가 잡히는지 확인
#
# 필드 설명은 config/venues.yaml 머리말 참조.
# =============================================================================

version: 1
owner: "홍길동"
domain: "여기에 내 연구 분야 한 줄"
updated: "2026-01-01"

conferences:
  # 예시 — 컴퓨터 비전 연구자라면 이런 식
  - id: CVPR
    name: "IEEE/CVF Conference on Computer Vision and Pattern Recognition"
    aliases: ["CVPR"]
    type: conference
    grade: S              # S=최우수, A=우수 (KIISE 2024 기준)
    priority: high        # high | normal | low
  - id: WACV
    name: "IEEE/CVF Winter Conference on Applications of Computer Vision"
    aliases: ["WACV"]
    type: conference
    grade: A
    priority: normal

journals:
  # 저널은 source(등급 근거 URL)와 sjr 가 필수. Scimago 저널 페이지 URL 을 넣는다.
  - id: TPAMI
    name: "IEEE Transactions on Pattern Analysis and Machine Intelligence"
    aliases: ["TPAMI", "IEEE Trans. Pattern Anal. Mach. Intell."]
    type: journal
    grade: top            # top | Q1 | Q2
    priority: high
    sjr: {year: 2025, quartile: Q1, category: "Artificial Intelligence"}
    source: "https://www.scimagojr.com/journalsearch.php?q=24254&tip=sid"

workshops:
  # 워크숍은 source 와 colocated(병설 학회) 를 적는다.
  - id: CVPRW
    name: "CVPR Workshops"
    aliases: ["CVPRW", "CVPR Workshop"]
    type: workshop
    grade: W
    priority: low
    colocated: "CVPR"
    source: "https://cvpr.thecvf.com/"

preprints:
  - id: arXiv
    name: "arXiv"
    aliases: ["arxiv.org", "arXiv preprint", "arXiv:"]
    type: preprint
    grade: P
    priority: normal
    categories: ["cs.CV", "cs.LG"]   # 비우면 전체 허용
