# =============================================================================
# venues.yaml — 내가 추적할 학회 · 저널 · 워크숍 (정현 / carbon-aware cloud computing)
# =============================================================================
# 이 파일에 있는 venue만 리뷰 대상이 된다. 여기 없으면 전부 pass.
#
# 각 항목:
#   id       : 짧은 고유 식별자 (라벨·로그에 쓰임)
#   name     : 정식 명칭 — 알림 이메일의 출처 문자열과 대조되는 1차 키
#   aliases  : 약칭·변형 표기 — 2차 키. 3글자 이하 약칭은 연도가 붙은 형태("SC '24", "SC24")에서만 매칭됨
#   type     : conference | journal | workshop | preprint
#   grade    : conference → S(최우수) / A(우수)
#              journal    → top / Q1 / Q2
#              workshop   → W
#              preprint   → P
#   priority : high | normal | low  — 키워드 그룹당 1편 고를 때 가중치
#   note     : 사람용 메모. 근거·주의점.
#   source   : 등급 근거 URL (저널·워크숍은 필수, 학회는 catalog/ 참조)
#
# grade별 처리 방식(전체 리뷰 / 요약 / pass)은 profile.yaml의 policy 에서 정한다.
# 검증: python scripts/validate.py
# 매칭 테스트: python scripts/match.py "출처 문자열"
# =============================================================================

version: 1
owner: "정현"
domain: "carbon-aware cloud computing, green cloud, sustainable AI infrastructure"
