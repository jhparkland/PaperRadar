# =============================================================================
# 출처
#   kiise_2024 : 한국정보과학회 「SW분야 우수학술대회 목록 2024」 소분야 OS / Net / Arch / HPC
#                https://www.kiise.or.kr/TopConferences/data/SW분야우수학술대회목록_2024.pdf
#                S = 최우수, A = 우수
#   bk21plus_if: BK21플러스(3단계, 2018) CS 분야 우수국제학술대회 인정IF (1~4)
#                ※ 4단계 BK21 은 NRF 공식 학회 명단이 없다. 실무는 KIISE 목록 + 이 구 목록을 참조.
#   core       : ICORE2026 (portal.core.edu.au/conf-ranks). 시스템 분야 오분류 다수 → 참고만.
#   csrankings : csrankings.org 집계 대상 여부
# 갱신: docs/venue-research.md 절차로 재조사. 조사일 2026-09-02.
# =============================================================================
version: 1
source_date: "2026-09-02"

subfields:
  OS:
    S: [ASPLOS, EuroSys, RTAS, RTSS, SIGMETRICS, SOSP, "USENIX ATC", "USENIX FAST", "USENIX OSDI"]
    A: [CASES, "CODES+ISSS", ECRTS, EMSOFT, ICCPS, MASCOTS, Middleware, MLSys, MMSys, MSST, SRDS, SYSTOR]
  Net:
    S: [CoNEXT, INFOCOM, MobiCom, MobiSys, SIGCOMM, "USENIX NSDI"]
    A: [ANCS, ICN, ICNP, IMC, IPSN, MASS, MobiHoc, NOMS, PAM, PerCom, SECON, SenSys, WiOpt, WoWMoM]
  Arch:
    S: [DAC, HPCA, ISCA, MICRO, PACT]
    A: [DATE, FCCM, FPGA, FPL, ICCAD, ICCD, IISWC, ISLPED, ISPASS]
  HPC:
    S: [PODC, PPoPP, SC]
    A: [CCGrid, CLOUD, CLUSTER, DISC, Euro-Par, HPDC, ICDCS, ICPP, ICS, IPDPS, SoCC, SPAA]

