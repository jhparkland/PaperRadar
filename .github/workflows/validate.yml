# venues.yaml / profile.yaml 을 고칠 때마다 자동 검사. 실패하면 PR 이 빨간불.
name: validate-config
on:
  push:
    paths: ["config/**", "scripts/**", "catalog/**"]
  pull_request:
    paths: ["config/**", "scripts/**", "catalog/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python scripts/validate.py
      - run: python scripts/match.py --test
      - name: validate examples
        run: python scripts/validate.py --venues config/examples/venues.example.yaml --profile config/examples/profile.example.yaml
      - name: catalog yaml parses
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('catalog/*.yaml')]; print('catalog ok')"
